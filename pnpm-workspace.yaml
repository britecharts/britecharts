packages:
  - packages/core
  - packages/wrappers
  - packages/react
  - packages/*

# One version per dependency that more than one package declares. Each
# package.json names it as `catalog:`; pnpm writes the real version into a
# published package.json when it packs it.
catalog:
  "@babel/cli": 7.29.7
  "@babel/core": 7.29.7
  "@babel/preset-react": 7.29.7
  "@babel/preset-typescript": 7.29.7
  "@storybook/addon-a11y": 8.6.14
  "@storybook/addon-essentials": 8.6.14
  "@storybook/addon-links": 8.6.14
  "@storybook/html-webpack5": 8.6.14
  "@storybook/manager-api": 8.6.14
  "@storybook/theming": 8.6.14
  "@types/d3-selection": 3.0.12
  "@types/jest": 29.5.9
  babel-loader: 8.4.1
  chromatic: 6.24.1
  d3-selection: 3.0.0
  eslint: 8.57.1
  jest: 29.7.0
  postcss: 8.5.28
  raw-loader: 4.0.2
  react: 19.3.0
  react-dom: 19.3.0
  rimraf: 2.7.1
  sass: 1.105.0
  sass-loader: 10.5.2
  storybook: 8.6.14
  vite: 8.3.0
  stylelint: 14.16.1
  stylelint-config-sass-guidelines: 9.0.1
  stylelint-config-standard: 29.0.0
  webpack: 5.111.1

# pnpm blocks a dependency's install/build scripts by default; each of these
# is a known, legitimate reason to run one -- a native binary (fsevents,
# esbuild, @parcel/watcher) or a package that only prints a support notice on
# install (core-js, ejs). Approving one here does not approve any of its own
# transitive dependencies.
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  ejs: true
  esbuild: true
  fsevents: true
