<!doctype html>
<!-- Source of blog/2026-11-02-britecharts-3/social-preview.png.
     Capture at 1200 × 630 with a device scale factor of 1. No network required. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Britecharts 3.0 release preview</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #fff;
            color: #1d2a33;
            font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            padding: 40px 56px;
            border-top: 10px solid #f6682f;
        }
        header { display: flex; align-items: center; justify-content: space-between; }
        header img { width: 250px; height: auto; }
        .version { color: #b53c10; font-size: 20px; font-weight: 700; }
        h1 { margin: 26px 0 8px; font-size: 55px; line-height: 1.12; letter-spacing: -1.5px; }
        .subtitle { margin: 0; color: #53616c; font-size: 26px; }
        .charts { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; margin-top: 28px; }
        .chart { height: 240px; border: 1px solid #e3e8ec; border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: center; }
        .chart img { width: 100%; height: 100%; object-fit: contain; }
        footer { margin-top: 22px; color: #53616c; font-size: 20px; }
    </style>
</head>
<body>
    <header>
        <img src="../static/img/brand/britecharts-logo.svg" alt="Britecharts">
        <span class="version">VERSION 3.0</span>
    </header>
    <h1>Accessible D3 charts.<br>Ready for your product.</h1>
    <p class="subtitle">JavaScript &amp; React · Keyboard navigation · Dark mode · TypeScript</p>
    <div class="charts">
        <div class="chart"><img src="../blog/2026-11-02-britecharts-3/horizontal-bar.png" alt="A colourful horizontal bar chart"></div>
        <div class="chart"><img src="../blog/2026-11-02-britecharts-3/treemap.png" alt="A treemap showing household spending"></div>
    </div>
    <footer>Free and open source · britecharts.github.io/britecharts</footer>
</body>
</html>
