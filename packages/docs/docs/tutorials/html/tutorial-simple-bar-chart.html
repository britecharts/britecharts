<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tutorial - Simple Bar Chart with Britecharts</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@britecharts/core/dist/styles/bundle/britecharts.min.css"
            type="text/css" />

        <script src="https://cdn.jsdelivr.net/npm/@britecharts/core/dist/cdn/bundle/core.cdn.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.11/lodash.min.js"
            type="text/javascript"></script>
    </head>
    <body>
        <div class="bar-container"></div>

        <script>
            // Instantiate Bar Chart
            const barChart = core.bar();
            const container = document.querySelector('.bar-container');

            // Create Dataset with proper shape
            const barData = [
                { name: 'Luminous', value: 2 },
                { name: 'Glittering', value: 5 },
                { name: 'Intense', value: 4 },
                { name: 'Radiant', value: 3 }
            ];

            // Configure chart
            barChart
                .margin({left: 100})
                .isHorizontal(true)
                .height(400)
                .width(600);

            barChart.render(container, barData);

            const redrawChart = () => {
                const newContainerWidth = container.getBoundingClientRect().width;

                // Setting the new width on the chart, and rendering it again
                barChart.width(newContainerWidth).render(container);
            };
            const throttledRedraw = _.throttle(redrawChart, 200);

            window.addEventListener("resize", throttledRedraw);
        </script>
    </body>

</html>
