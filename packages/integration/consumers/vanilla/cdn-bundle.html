<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>C1 · CDN bundle via script tag</title>
    <link rel="stylesheet" href="/src/page.css">
    <link rel="stylesheet" href="/vendor/styles/bundle/britecharts.min.css">
    <script src="/vendor/d3-selection.min.js"></script>
    <script src="/vendor/cdn/bundle/core.cdn.min.js"></script>
</head>
<body>
    <h1>C1 · CDN bundle via script tag</h1>
    <div class="bar-container"></div>
    <script>
        var barData = [
            { name: "Luminous", value: 2 },
            { name: "Glittering", value: 5 },
            { name: "Intense", value: 4 },
            { name: "Radiant", value: 3 },
        ];
        var barChart = core.bar()
            .margin({ left: 100 })
            .isHorizontal(true)
            .height(400)
            .width(600);

        d3.select(".bar-container").datum(barData).call(barChart);
    </script>
</body>
</html>
