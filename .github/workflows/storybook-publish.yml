name: Visual tests on Chromatic

# Publishes the core and react Storybooks to Chromatic for visual review. The
# composed demos Storybook is only *built* here, as a check: it has no stories
# of its own (two MDX pages and two composition refs, which Chromatic never
# snapshots), so Chromatic rejected it on every run with "Cannot run a build
# with no stories". It is hosted on GitHub Pages instead, by docs-deploy.yml.
#
# Was `on: push` for every branch, which spent a Chromatic snapshot on every
# commit anywhere in the repo.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic-deployment:
    name: Deploy to Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # Chromatic needs the full history to work out the baseline build.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages 🔧
        run: yarn build:packages

      - name: Build core storybook 🔧
        run: yarn workspace @britecharts/core demo:build

      - name: Publish core storybook to Chromatic 🚀
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN_CORE }}
          autoAcceptChanges: 'main'
          storybookBuildDir: './packages/core/dist/storybook'

      - name: Build react storybook 🔧
        run: yarn workspace @britecharts/react demo:build

      # TEMPORARY, for the React hooks migration: no autoAcceptChanges on this
      # step. The migration lands as many merges to main, and with
      # auto-accept the first merged regression becomes the new baseline
      # before anyone has looked at it. Changes are reported, not accepted,
      # and exitZeroOnChanges keeps unreviewed ones from turning main red.
      # The core step above keeps auto-accept: the migration does not touch it.
      #
      # Restore `autoAcceptChanges: 'main'` and drop `exitZeroOnChanges` at the
      # end of the migration (Phase 5), once every diff has been reviewed.
      #
      # The baseline is pinned by hand: after the first main build that
      # contains the stories added for the migration, accept it once in
      # Chromatic. Every later change is then reviewed against that build.
      - name: Publish react storybook to Chromatic 🚀
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN_REACT }}
          exitZeroOnChanges: true
          storybookBuildDir: './packages/react/dist/storybook'

      - name: Build the composed storybook (check only) 🔧
        run: yarn workspace @britecharts/demos build
