name: Visual tests on Chromatic

# Publishes the core and react Storybooks to Chromatic for visual review. The
# composed demos Storybook is only *built* here, as a check: it has no stories
# of its own (two MDX pages and two composition refs, which Chromatic never
# snapshots), so Chromatic rejected it on every run with "Cannot run a build
# with no stories". It is hosted on GitHub Pages instead, by docs-deploy.yml.
#
# Was `on: push` for every branch, which spent a Chromatic snapshot on every
# commit anywhere in the repo.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic-deployment:
    name: Deploy to Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # Chromatic needs the full history to work out the baseline build.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependabot PRs do not receive Actions secrets. Keep building every
      # Storybook, and publish only when its project token is available.
      - name: Check Chromatic publishing credentials
        id: chromatic-tokens
        env:
          CHROMATIC_TOKEN_CORE: ${{ secrets.CHROMATIC_TOKEN_CORE }}
          CHROMATIC_TOKEN_REACT: ${{ secrets.CHROMATIC_TOKEN_REACT }}
        run: |
          for project in core react; do
            case "$project" in
              core) token="$CHROMATIC_TOKEN_CORE" ;;
              react) token="$CHROMATIC_TOKEN_REACT" ;;
            esac
            if [ -n "$token" ]; then
              echo "${project}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${project}=false" >> "$GITHUB_OUTPUT"
              echo "Chromatic publishing skipped for ${project}: project token unavailable. Storybook builds still run." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Build all packages 🔧
        run: pnpm run build:packages

      - name: Build core storybook 🔧
        run: pnpm --filter @britecharts/core run demo:build

      - name: Publish core storybook to Chromatic 🚀
        if: steps.chromatic-tokens.outputs.core == 'true'
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN_CORE }}
          autoAcceptChanges: 'main'
          storybookBuildDir: './packages/core/dist/storybook'

      - name: Build react storybook 🔧
        run: pnpm --filter @britecharts/react run demo:build

      - name: Publish react storybook to Chromatic 🚀
        if: steps.chromatic-tokens.outputs.react == 'true'
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN_REACT }}
          autoAcceptChanges: 'main'
          storybookBuildDir: './packages/react/dist/storybook'

      - name: Build the composed storybook (check only) 🔧
        run: pnpm --filter @britecharts/demos run build
