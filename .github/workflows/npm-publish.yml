# NOTE: the publish step below is NOT the release flow yet.
#
# It runs `npm publish` at the repo root, which in a workspaces repo tries to
# publish the root package rather than the five workspaces. That root package
# is now `"private": true`, so this fails safely instead of publishing the
# wrong thing — but it does not publish anything either.
#
# Replacing it is M7/M8: a Changesets release job that runs
# `yarn version-packages` and then `yarn release`, which publishes through
# `yarn npm publish` so the `workspace:^` ranges resolve to real versions.

name: NPM Publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build 🔧
        run: yarn build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
