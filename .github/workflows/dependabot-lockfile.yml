name: Dependabot lockfile

# Dependabot updates pnpm-lock.yaml for a transitive bump, but for a direct
# dependency it edits package.json alone (#1110, #1111), so every check then
# fails at `pnpm install --frozen-lockfile`. This job relocks the pull request
# and pushes the lockfile back to its branch.
#
# It pushes with the DEPENDABOT_LOCKFILE_TOKEN Dependabot secret: a
# fine-grained token with Contents read and write on this repository. A push
# made with GITHUB_TOKEN starts no workflow runs, so the checks would never run
# on the relocked commit. Without the secret it falls back to GITHUB_TOKEN, and
# the pull request needs closing and reopening to get its checks.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relock:
    name: Update pnpm-lock.yaml
    # The push below is made by the token's owner, not by Dependabot, so it
    # does not start this job again.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN || github.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # Resolution only: no package is downloaded into node_modules and no
      # install script runs.
      - name: Relock
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit the lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): update pnpm-lock.yaml'
          git push
