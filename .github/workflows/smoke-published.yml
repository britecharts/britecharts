name: Smoke test the published packages

# The Integration workflow tests what *would* ship, from local tarballs. This
# one tests what *did* ship: the consumers are installed from the npm registry
# and the CDN page loads from jsDelivr. It is the only workflow whose
# assertions touch the network, so it is never part of the PR job.
#
# Runs after every successful Release run (which publishes when the
# "Version Packages" PR is merged; when Release only updated that PR the
# version on main is usually already published and gets re-tested, or is not
# published yet and the job says so and stops). Also runs on demand for any
# version or dist-tag.
#
# The consumers' tests are checked out from the commit that published the
# version under test, not from main: main's type tests track main's types, so
# any type change merged before the next release would fail them against the
# older published .d.ts files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or dist-tag of @britecharts/* to test (e.g. 3.0.0-beta.1, latest)'
        required: true
        default: latest
  workflow_run:
    workflows: ['Release']
    types: [completed]

concurrency:
  group: smoke-published
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release commit is looked up in the history

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Resolve the version to test
        id: version
        # Right after a publish the registry can take minutes to serve the new
        # version, so a run that follows the "version packages" merge -- the
        # one Release publishes on -- waits up to ten minutes for it. Any other
        # run asks once: its version was either published long ago or not yet.
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          AFTER_PUBLISH: ${{ github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_commit.message, 'chore: version packages') }}
        run: |
          requested="${REQUESTED:-$(node -p "require('./packages/core/package.json').version")}"
          attempts=1
          if [ "$AFTER_PUBLISH" = "true" ]; then attempts=20; fi
          resolved="$(node scripts/registry-version.js "@britecharts/core@${requested}" "$attempts" 30000)"
          if [ -z "$resolved" ]; then
            echo "::notice::@britecharts/core@${requested} is not on the registry; nothing to smoke test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Testing @britecharts/*@${resolved}"
            echo "version=${resolved}" >> "$GITHUB_OUTPUT"
          fi

      # npm records the commit a version was packed from as gitHead, but not
      # for every publish (3.0.0-beta.3 has none). The fallback is the
      # Changesets commit that first wrote that version into core's manifest.
      - name: Check out the release commit
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha="$(npm view "@britecharts/core@${VERSION}" gitHead 2>/dev/null || true)"
          if [ -z "$sha" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            sha="$(git log --reverse --format=%H -S"\"version\": \"${VERSION}\"" -- packages/core/package.json | head -n 1)"
          fi
          if [ -z "$sha" ]; then
            echo "::error::No commit found for @britecharts/core@${VERSION}."
            exit 1
          fi
          echo "Testing with the consumers from ${sha}"
          git checkout --detach "$sha"

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        if: steps.version.outputs.skip != 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.version.outputs.skip != 'true'
        run: pnpm --filter @britecharts/integration exec playwright install --with-deps chromium

      # No pack step: the consumers install @britecharts/*@<version> from npm.
      # The tarball tier is skipped for the same reason; the require, types
      # and browser tiers run unchanged, plus the jsDelivr page.
      - name: Test the published packages 🌐
        if: steps.version.outputs.skip != 'true'
        env:
          BRITECHARTS_SOURCE: registry
          BRITECHARTS_VERSION: ${{ steps.version.outputs.version }}
          VITE_BRITECHARTS_VERSION: ${{ steps.version.outputs.version }}
          SMOKE_REGISTRY: '1'
        run: pnpm --filter @britecharts/integration run test:published

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-published
          path: packages/integration/test-results
          retention-days: 7
