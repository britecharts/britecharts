name: Release

# Changesets owns versioning. On a push to main it opens (or updates) a
# "Version Packages" PR that applies the accumulated changesets; merging that
# PR is what triggers the publish, so releasing is a review step rather than a
# tag or a manual run.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR / commit
      pull-requests: write # open and update it
      id-token: write # npm provenance
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create version PR or publish 🚀
        uses: changesets/action@v2
        with:
          version: yarn version-packages
          # Publishes through `yarn npm publish`, not `npm publish`: Yarn is
          # what resolves the workspace:^ ranges between these packages into
          # real version numbers at pack time.
          publish: yarn release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
