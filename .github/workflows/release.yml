name: Release

# Changesets owns versioning. On a push to main it opens (or updates) a
# "Version Packages" PR that applies the accumulated changesets; merging that
# PR is what triggers the publish, so releasing is a review step rather than a
# tag or a manual run.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR / commit
      pull-requests: write # open and update it
      id-token: write # npm provenance
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # setup-node's registry-url option writes a .npmrc with
      # ${NODE_AUTH_TOKEN} for npm to interpolate at read time -- npm's own
      # convention, which Yarn 3 never read either (the previous bug here).
      # pnpm reads .npmrc too, but does not interpolate ${VAR} placeholders in
      # it at all (verified: a literal ${TOKEN} in .npmrc resolves to
      # undefined even with the variable set), so the placeholder route is
      # never going to work for pnpm. Writing the real value directly, with
      # the substitution done by the workflow YAML before this ever reaches
      # pnpm, sidesteps the question entirely.
      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Create version PR or publish 🚀
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          # Publishes through `pnpm publish`, not `npm publish`: pnpm is what
          # resolves the workspace:^ ranges between these packages into real
          # version numbers at pack time.
          publish-script: pnpm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
