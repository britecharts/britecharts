name: Link check

# Broken links are this project's most persistent recurring failure: the docs
# moved hosts twice, and every move left dead links behind. Docusaurus fails
# the build on a broken internal link; this job builds the site, serves it
# and follows every link on every page, external ones included. The weekly
# run catches links that rot with nothing changing on our side.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: Check every link on the docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build, because it needs neither the site nor the network.
      #
      # `docs:links` below follows links over the network against `main`, so a
      # link to a file this branch renames stays green for the whole life of the
      # pull request and turns red only once it merges. That is how `color.js`
      # became `color.ts` in #1083 with a passing link check, and took `main`
      # red on the merge. This resolves the same links against the checkout, so
      # a rename fails on the pull request that causes it -- which matters while
      # the TypeScript migration renames most of the library.
      - name: Check links to source files 🧭
        run: pnpm run docs:source-links

      - name: Build docs website 📚
        run: pnpm run docs:build

      - name: Check links 🔗
        run: pnpm run docs:links
