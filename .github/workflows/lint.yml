name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lints Britecharts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing compared a chart's runtime surface against its typings, and
      # eighteen accessors across eight charts had drifted out of the published
      # declarations -- a consumer writing TypeScript could not call any of them.
      # It is a lint rather than a test because the answer is static: what the
      # source assigns, against what the compiler says the module type has.
      - name: Chart API parity 🔍
        run: pnpm run check:api-parity

      - name: Linting Styles 🌈
        run: pnpm run lint:styles

      - name: Linting Code 🗃
        run: pnpm run lint:js

      # The gate that actually enforces type correctness. Babel strips types
      # for the bundles and for Jest without ever checking them, so without
      # this step nothing in CI would.
      - name: Type-checking 🧷
        run: pnpm run type-check
