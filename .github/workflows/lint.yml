name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lints Britecharts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Linting Styles 🌈
        run: pnpm run lint:styles

      - name: Linting Code 🗃
        run: pnpm run lint:js

      # The gate that actually enforces type correctness. Babel strips types
      # for the bundles and for Jest without ever checking them, so without
      # this step nothing in CI would.
      - name: Type-checking 🧷
        run: pnpm run type-check
