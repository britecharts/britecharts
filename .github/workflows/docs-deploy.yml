name: Docs Deployment to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs website 📚
        run: pnpm run docs:build

      # The Storybooks live under /storybook/ on the same site: the composed
      # shell at /storybook/, and the two it references at /storybook/core
      # and /storybook/react. Same origin, so composition needs no CORS and
      # no login -- which is what publishing them to Chromatic could not give.
      - name: Build packages 🔧
        run: pnpm run build:packages

      - name: Build the Storybooks 📖
        run: |
          pnpm --filter @britecharts/core run demo:build
          pnpm --filter @britecharts/react run demo:build
          pnpm --filter @britecharts/demos run build

      - name: Add the Storybooks to the site
        run: node scripts/compose-site.js

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/docs/build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
