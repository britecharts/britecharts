name: Integration Tests

# Builds the packages, packs them the way the release does, and checks what
# would ship. Required on main: the Changesets "version packages" PR gets it
# too, which makes it the last gate before release.yml publishes.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages 🔧
        run: yarn build:packages

      - name: Pack and check what ships 📦
        run: yarn test:integration
